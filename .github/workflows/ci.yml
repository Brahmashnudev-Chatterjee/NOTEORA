
name: Noteora CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: noteora
          POSTGRES_USER: noteora_dev
          POSTGRES_PASSWORD: ci_postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U noteora_dev -d noteora"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://noteora_dev:ci_postgres_password@127.0.0.1:5432/noteora?schema=marketplace
      TEST_DATABASE_URL: postgresql://noteora_dev:ci_postgres_password@127.0.0.1:5432/noteora?schema=marketplace
      MONGO_URI: mongodb://127.0.0.1:27017/noteora
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci-only-test-access-secret
      JWT_REFRESH_SECRET: ci-only-test-refresh-secret
      GATEWAY_JWT_SECRET: ci-only-test-gateway-secret
      GATEWAY_WEBHOOK_ENCRYPTION_KEY: ci-only-test-webhook-key
      NOTEORA_ADMIN_TOKEN: ci-only-test-admin-token

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install marketplace and gateway dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix client
          npm ci --prefix gateway-api

      - name: Validate Docker Compose
        run: docker compose config
        env:
          POSTGRES_ADMIN_PASSWORD: ci_postgres_password
          POSTGRES_DB: noteora
          MARKETPLACE_APP_PASSWORD: ci_marketplace_password
          WORKER_PASSWORD: ci_worker_password
          MIGRATION_PASSWORD: ci_migration_password
          DATABASE_ADMIN_PASSWORD: ci_database_admin_password
          REDIS_PASSWORD: ci_redis_password
          JWT_ACCESS_SECRET: ci-only-test-access-secret
          JWT_REFRESH_SECRET: ci-only-test-refresh-secret
          GATEWAY_JWT_SECRET: ci-only-test-gateway-secret
          GATEWAY_WEBHOOK_ENCRYPTION_KEY: ci-only-test-webhook-key

      - name: Create PostgreSQL schemas and apply migrations
        env:
          PGPASSWORD: ci_postgres_password
        run: |
          psql -h 127.0.0.1 -p 5432 -U noteora_dev -d noteora -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS marketplace; CREATE SCHEMA IF NOT EXISTS gateway;'
          psql -h 127.0.0.1 -p 5432 -U noteora_dev -d noteora -v ON_ERROR_STOP=1 -f database/prisma/migrations/20261108175257_phase5b/migration.sql
          psql -h 127.0.0.1 -p 5432 -U noteora_dev -d noteora -v ON_ERROR_STOP=1 -f database/prisma/migrations/20261108_phase5c/migration.sql

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build frontend, backend and gateway
        run: |
          npm run build
          npm --prefix gateway-api run build

      - name: Run marketplace backend tests
        run: npm --prefix server test

      - name: Run PostgreSQL integration tests
        run: npm --prefix server run test:postgres

      - name: Run gateway security tests
        run: npm --prefix gateway-api test
