server {
 listen 8080;
 server_tokens off;
 root /usr/share/nginx/html;
 access_log off;
 client_max_body_size 32m;
 resolver 127.0.0.11 valid=30s;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options SAMEORIGIN always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
 location = /healthz { return 200 'alive'; }
 location = /api/health { return 404; }
 location /api/ {
  set $marketplace http://marketplace-api:5000;
  proxy_pass $marketplace;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # Set this only behind the documented trusted TLS ingress; no public direct ports.
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
 }
 location /gateway-api/ {
  set $gateway http://gateway-api:5100;
  rewrite ^/gateway-api/(.*)$ /api/$1 break;
  proxy_pass $gateway;
  proxy_cookie_path /api/v1/auth /gateway-api/v1/auth;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
 }
 location / { try_files $uri $uri/ /index.html; }
}
